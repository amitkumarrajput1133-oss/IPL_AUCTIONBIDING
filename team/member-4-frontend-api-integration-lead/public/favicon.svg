<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="85%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gold Championship Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cricket Ball Crimson Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="55%" stop-color="#dc2626" />
      <stop offset="90%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- Wood Bat Gradient -->
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Shield Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)" />
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Crossed Cricket Bats -->
  <!-- Left Bat -->
  <g transform="rotate(-45 32 32)">
    <rect x="29" y="10" width="6" height="28" rx="2" fill="url(#batGrad)" stroke="#7c2d12" stroke-width="0.75" />
    <!-- Handle -->
    <rect x="30.5" y="38" width="3" height="16" rx="1.5" fill="#f8fafc" stroke="#334155" stroke-width="0.5" />
    <!-- Grip lines -->
    <line x1="30.5" y1="42" x2="33.5" y2="42" stroke="#dc2626" stroke-width="0.75" />
    <line x1="30.5" y1="46" x2="33.5" y2="46" stroke="#dc2626" stroke-width="0.75" />
    <line x1="30.5" y1="50" x2="33.5" y2="50" stroke="#dc2626" stroke-width="0.75" />
  </g>

  <!-- Right Bat -->
  <g transform="rotate(45 32 32)">
    <rect x="29" y="10" width="6" height="28" rx="2" fill="url(#batGrad)" stroke="#7c2d12" stroke-width="0.75" />
    <!-- Handle -->
    <rect x="30.5" y="38" width="3" height="16" rx="1.5" fill="#f8fafc" stroke="#334155" stroke-width="0.5" />
    <!-- Grip lines -->
    <line x1="30.5" y1="42" x2="33.5" y2="42" stroke="#0284c7" stroke-width="0.75" />
    <line x1="30.5" y1="46" x2="33.5" y2="46" stroke="#0284c7" stroke-width="0.75" />
    <line x1="30.5" y1="50" x2="33.5" y2="50" stroke="#0284c7" stroke-width="0.75" />
  </g>

  <!-- Center Glowing Cricket Ball -->
  <circle cx="32" cy="32" r="13" fill="url(#ballGrad)" stroke="#fef08a" stroke-width="1" />

  <!-- Cricket Ball Seam Stitching -->
  <path d="M 23 23 Q 32 32 41 41" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="1.2,1.2" />
  <path d="M 22.5 24.5 Q 31.5 33.5 40.5 42.5" fill="none" stroke="#fecaca" stroke-width="0.6" stroke-opacity="0.8" />

  <!-- Ball Glow Specular Highlight -->
  <ellipse cx="27" cy="27" rx="3.5" ry="2" fill="#ffffff" fill-opacity="0.4" transform="rotate(-30 27 27)" />

  <!-- Golden Crown / Stars Accent at the Top -->
  <path d="M 26 12 L 28 7 L 32 10 L 36 7 L 38 12 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.5" />
</svg>